<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment- Sancharam</title>
    <link rel="stylesheet" href="css/stylepay.css">

<script src="https://kit.fontawesome.com/7f257b9379.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../../assets/css/style.css">

<!-- Global Nav/Footer CSS injected -->
<style id="global-nav-footer">
    .navbar { font-family: 'Montserrat', sans-serif; }
    .navbar .container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; }
    .navbar.bg-dark { background-color: #000000; }
    .navbar .logo { float: left; padding-top: 6px; }
    .navbar .nav-items { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; }
    .navbar .nav-item { display: inline-block; padding: 1.5rem; text-transform: uppercase; }
    .navbar a { color: aliceblue; text-decoration: none; font-size: 1.6rem; font-weight: bold; }
    .navbar a:hover { border-bottom: 1px solid #FFF; }
    .navbar::after { content: ''; display: block; clear: both; }
    .footer { font-size: 1rem; padding: 1rem; background: #263238; color: #f4f4f4; margin-top: auto; text-align: center; width: 100%; font-family: 'Montserrat', sans-serif; }
    .footer .social-media-links i { padding: 1.5rem; margin-bottom: 1rem; font-size: 4rem; color: #f4f4f4; }
    @media (max-width: 768px) {
        .navbar .container { flex-direction: column; }
        .navbar .nav-items { flex-direction: column; width: 100%; text-align: center; }
    }
</style>
<script src="https://kit.fontawesome.com/7f257b9379.js" crossorigin="anonymous"></script>

</head>

<body>
<nav class="navbar bg-dark">
    <div class="container">
        <img src="../../assets/logos/logo.png" alt="Sancharam Logo" class="logo" style="width: 300px; height: 80px;">
        <ul class="nav-items">
            <li class="nav-item"><a href="../../home.html">Home</a></li>
            <li class="nav-item"><a href="../../pages/about.html">About</a></li>
            <li class="nav-item"><a href="../../pages/explore.html">Explore</a></li>
            <li class="nav-item"><a href="../../pages/bookings.html">Bookings</a></li>
            <li class="nav-item"><a href="../../pages/features.html">Features</a></li>
            <li class="nav-item"><a href="../../pages/profile.html">Profile</a></li>
        </ul>
    </div>
</nav>


    <div class="container">
        <form action="">
            <div class="row">
                <div class="column">
                    <h3 class="title">Billing Address</h3>
                    <div class="input-box">
                        <span>Full Name :</span>
                        <input type="text" placeholder="Mia Malkan">
                    </div>
                    <div class="input-box">
                        <span>Email :</span>
                        <input type="email" placeholder="example@example.com">
                    </div>
                    <div class="input-box">
                        <span>Address :</span>
                        <input type="text" placeholder="Room - Street - Locality">
                    </div>
                    <div class="input-box">
                        <span>City :</span>
                        <input type="text" placeholder="California">
                    </div>

                    <div class="flex">
                        <div class="input-box">
                            <span>State :</span>
                            <input type="text" placeholder="USA">
                        </div>
                        <div class="input-box">
                            <span>Zip Code :</span>
                            <input type="number" placeholder="123 456">
                        </div>
                    </div>
                </div>

                <div class="column">
                    <h3 class="title">Payment</h3>
                    <div class="input-box">
                        <span>Cards Accepted :</span>
                        <img src="https://cdn-icons-png.flaticon.com/512/5566/5566931.png" alt="">
                    </div>
                    <div class="input-box">
                        <span>Name On Card :</span>
                        <input type="text" placeholder="Mrs. Mia Malkan">
                    </div>
                    <div class="input-box">
                        <span>Credit Card Number :</span>
                        <input type="number" placeholder="1111 2222 3333 4444">
                    </div>
                    <div class="input-box">
                        <span>Exp. Month :</span>
                        <input type="text" placeholder="August">
                    </div>
                
                    <div class="flex">
                        <div class="input-box">
                            <span>Exp. Year :</span>
                            <input type="number" placeholder="2028">
                        </div>
                        <div class="input-box">
                            <span>CVV :</span>
                            <input type="number" placeholder="123">
                        </div>
                    </div>
                </div>
            </div>
            <div class="total-price">
                <h3>Total Amount :</h3>
                <span>₹100.00</span>    
            </div>      
            <button type="submit" class="btn" onclick="alert('Booking Completed Successfully!');">Submit</button>
        </form>
    </div>


<footer class="footer">
        <div class="social-media-links">
            <i class="fab fa-facebook fa-4x"></i>
            <i class="fab fa-twitter fa-4x"></i>
            <i class="fab fa-instagram fa-4x"></i>
        </div>
        <p>Sancharam &copy; 2025, All Rights Reserved</p>
    </footer>
</body>

</html>
