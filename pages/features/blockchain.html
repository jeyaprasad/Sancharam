<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sancharam | Blockchain Digital ID</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0a0a0a;
    color:white;
    overflow-x:hidden;
}

/* Animated Background Glow */
body::before{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,#ff4d00 0%, transparent 60%);
    top:-150px;
    right:-150px;
    opacity:0.15;
    animation:moveGlow 8s infinite alternate ease-in-out;
    z-index:-1;
}

@keyframes moveGlow{
    from{transform:translate(0,0);}
    to{transform:translate(-100px,80px);}
}

/* Hero */
.hero{
    text-align:center;
    padding:80px 20px 40px;
}

.hero h1{
    font-size:60px;
    letter-spacing:3px;
}

.hero span{
    color:#ff4d00;
}

.hero p{
    opacity:0.6;
}

/* Glass Container */
.feature-container {
    max-width:1000px;
    margin:40px auto;
    padding:40px;
    background:rgba(255,255,255,0.04);
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
}

/* Input Section */
.input-box{
    margin-top:20px;
}

input{
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:15px;
    background:#121212;
    border:1px solid #222;
    color:white;
    font-size:15px;
}

input:focus{
    border-color:#ff4d00;
    box-shadow:0 0 15px rgba(255,77,0,0.4);
    outline:none;
}

/* Button */
button{
    margin-top:25px;
    padding:15px 40px;
    background:#ff4d00;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-size:15px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px rgba(255,77,0,0.5);
}

/* Digital ID Card */
.id-card{
    margin-top:40px;
    padding:30px;
    border-radius:20px;
    background:linear-gradient(145deg,#111,#1a1a1a);
    border:1px solid rgba(255,255,255,0.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
    animation:fadeIn 0.8s ease-in-out;
}

/* Left Section */
.id-details h3{
    margin:0;
    font-size:22px;
}

.id-details p{
    opacity:0.7;
    margin:5px 0;
}

/* QR Placeholder */
.qr{
    width:120px;
    height:120px;
    background:#000;
    border:2px solid #ff4d00;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:#ff4d00;
}

/* Security Status */
.status{
    margin-top:20px;
    padding:20px;
    border-radius:15px;
    background:rgba(0,255,120,0.05);
    border:1px solid #00ff55;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>

<script src="https://kit.fontawesome.com/7f257b9379.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="../../assets/css/style.css">

<!-- Global Nav/Footer CSS injected -->
<style id="global-nav-footer">
    .navbar { font-family: 'Montserrat', sans-serif; }
    .navbar .container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; }
    .navbar.bg-dark { background-color: #000000; }
    .navbar .logo { float: left; padding-top: 6px; }
    .navbar .nav-items { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; }
    .navbar .nav-item { display: inline-block; padding: 1.5rem; text-transform: uppercase; }
    .navbar a { color: aliceblue; text-decoration: none; font-size: 1.6rem; font-weight: bold; }
    .navbar a:hover { border-bottom: 1px solid #FFF; }
    .navbar::after { content: ''; display: block; clear: both; }
    .footer { font-size: 1rem; padding: 1rem; background: #263238; color: #f4f4f4; margin-top: auto; text-align: center; width: 100%; font-family: 'Montserrat', sans-serif; }
    .footer .social-media-links i { padding: 1.5rem; margin-bottom: 1rem; font-size: 4rem; color: #f4f4f4; }
    @media (max-width: 768px) {
        .navbar .container { flex-direction: column; }
        .navbar .nav-items { flex-direction: column; width: 100%; text-align: center; }
    }
</style>
<script src="https://kit.fontawesome.com/7f257b9379.js" crossorigin="anonymous"></script>

</head>

<body>
<nav class="navbar bg-dark">
    <div class="container">
        <img src="../../assets/logos/logo.png" alt="Sancharam Logo" class="logo" style="width: 300px; height: 80px;">
        <ul class="nav-items">
            <li class="nav-item"><a href="../../home.html">Home</a></li>
            <li class="nav-item"><a href="../../pages/about.html">About</a></li>
            <li class="nav-item"><a href="../../pages/explore.html">Explore</a></li>
            <li class="nav-item"><a href="../../pages/bookings.html">Bookings</a></li>
            <li class="nav-item"><a href="../../pages/features.html">Features</a></li>
            <li class="nav-item"><a href="../../pages/profile.html">Profile</a></li>
        </ul>
    </div>
</nav>


<div class="hero">
    <h1>BLOCKCHAIN <span>DIGITAL ID</span></h1>
    <p>Secure Identity for Hotel Check-ins, Bookings & Emergency Verification</p>
</div>

<div class="feature-container">

    <div class="input-box">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name">
    </div>

    <div class="input-box">
        <label>Passport / Aadhaar Number</label>
        <input type="text" id="idNumber" placeholder="Enter government ID number">
    </div>

    <div class="input-box">
        <label>Emergency Contact</label>
        <input type="text" id="emergency" placeholder="Enter emergency contact">
    </div>

    <button onclick="generateID()">Generate Secure Digital ID</button>

    <div id="result"></div>

</div>

<script>

function generateID(){

    const name = document.getElementById("name").value;
    const idNumber = document.getElementById("idNumber").value;
    const emergency = document.getElementById("emergency").value;
    const result = document.getElementById("result");

    if(name === "" || idNumber === "" || emergency === ""){
        alert("Please fill all details.");
        return;
    }

    // Simulated Blockchain Hash
    const hash = "0x" + Math.random().toString(16).substr(2,16).toUpperCase();

    result.innerHTML = `
        <div class="id-card">
            <div class="id-details">
                <h3>${name}</h3>
                <p><strong>ID:</strong> ${idNumber}</p>
                <p><strong>Emergency:</strong> ${emergency}</p>
                <p><strong>Blockchain Hash:</strong> ${hash}</p>
            </div>

            <div class="qr">
                VERIFIED
            </div>
        </div>

        <div class="status">
            ✔ Identity Secured on Distributed Ledger Network  
            ✔ Tamper-Proof Verification Enabled  
            ✔ Ready for Hotel Check-in & Emergency Access  
        </div>
    `;
}

</script>


<footer class="footer">
        <div class="social-media-links">
            <i class="fab fa-facebook fa-4x"></i>
            <i class="fab fa-twitter fa-4x"></i>
            <i class="fab fa-instagram fa-4x"></i>
        </div>
        <p>Sancharam &copy; 2025, All Rights Reserved</p>
    </footer>
</body>
</html>
