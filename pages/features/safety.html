<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANCHARAM</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --accent: #ff4d00;
            --text: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Space Mono', monospace;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        main { width: 100%; max-width: 1200px; padding: 1rem; }

        .hero-title {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(2.5rem, 12vw, 11rem);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -6px;
            margin-bottom: 2rem;
            white-space: nowrap;
        }

        /* --- SETUP FORM --- */
        .setup-container {
            max-width: 450px;
            margin: 0 auto;
        }

        label {
            display: block;
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            background: #080808;
            border: 2px solid #1a1a1a;
            padding: 1.5rem;
            color: white;
            font-family: 'Space Mono';
            font-size: 1.2rem;
            outline: none;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        input:focus { border-color: var(--accent); }

        .btn-init {
            background: var(--accent);
            color: black;
            border: none;
            padding: 1.2rem;
            font-family: 'Archivo Black', sans-serif;
            width: 100%;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        /* --- PANIC UI --- */
        #panic-screen { display: none; }

        .panic-btn {
            width: 320px;
            height: 320px;
            border: 15px solid var(--accent);
            background: transparent;
            color: var(--accent);
            border-radius: 50%;
            font-family: 'Archivo Black', sans-serif;
            font-size: 2.2rem;
            cursor: pointer;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }

        .panic-btn:active {
            background: var(--accent);
            color: black;
            transform: scale(0.92);
        }

        .edit-link {
            margin-top: 2.5rem;
            color: #444;
            cursor: pointer;
            text-decoration: underline;
            display: inline-block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .edit-link:hover { color: var(--accent); }

        /* --- NOTIFICATION BAR --- */
        #alert-toast {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--accent);
            color: black;
            padding: 1.2rem;
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="alert-toast"></div>

    <main>
        <h1 class="hero-title">SANCHARAM</h1>

        <section id="setup-screen">
            <div class="setup-container">
                <label>Emergency Contact</label>
                <input type="tel" id="ePhone" placeholder="+91 XXXX XXXX">
                <button class="btn-init" onclick="saveData()">Save & Arm System</button>
            </div>
        </section>

        <section id="panic-screen">
            <button class="panic-btn" onclick="triggerAlert()">SEND<br>SIGNAL</button>
            <br>
            <span class="edit-link" onclick="editMode()">Change Guardian Number</span>
            <p style="margin-top: 3rem; color: #222; letter-spacing: 5px; font-size: 0.7rem;">ENCRYPTED_RELAY: ACTIVE</p>
        </section>
    </main>

    <script>
        // CONFIGURATION: Replace with your actual Pushbullet Token
        const PUSH_TOKEN = "o.SNl6d3vegveuqXX6Ur5iFsn5fWRDhZvV";

        // Check for existing data on load
        window.onload = function() {
            const savedNum = localStorage.getItem('sancharam_num');
            if (savedNum) {
                showPanic(savedNum);
            }
        };

        function saveData() {
            const num = document.getElementById('ePhone').value;
            if (num) {
                localStorage.setItem('sancharam_num', num);
                showPanic(num);
            } else {
                alert("Guardian number required.");
            }
        }

        function showPanic(num) {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('panic-screen').style.display = 'block';
        }

        function editMode() {
            localStorage.removeItem('sancharam_num');
            location.reload(); // Restarts the flow
        }

        async function triggerAlert() {
            const num = localStorage.getItem('sancharam_num');
            const toast = document.getElementById('alert-toast');

            // Visual Feedback (Flash)
            toast.innerText = "SIGNALING RELAY...";
            toast.style.display = 'block';
            document.body.style.backgroundColor = "white";
            setTimeout(() => { 
                document.body.style.backgroundColor = "black"; 
            }, 200);

            // True Free Relay via Pushbullet API
            try {
                const response = await fetch('https://api.pushbullet.com/v2/pushes', {
                    method: 'POST',
                    headers: {
                        'Access-Token': PUSH_TOKEN,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        type: 'note',
                        title: 'SANCHARAM_ALERT',
                        body: `Emergency: Contact ${num}`
                    })
                });

                if (response.ok) {
                    toast.innerText = `ALERT DISPATCHED TO ${num}`;
                } else {
                    toast.innerText = "RELAY ERROR: CHECK TOKEN";
                }
            } catch (error) {
                toast.innerText = "OFFLINE: SIGNAL FAILED";
                console.error(error);
            }

            // Hide toast after 4 seconds
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
